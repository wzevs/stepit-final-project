<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function addBaseTiles(map) {
  const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri",
  });
  const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: "abcd",
    attribution: "&copy; OpenStreetMap &copy; CARTO",
  });
  let switched = false;
  esri.on("tileerror", function () {
    if (switched) return;
    switched = true;
    map.removeLayer(esri);
    carto.addTo(map);
  });
  esri.addTo(map);
}

function bindLocationPicker(mapId, latInput, lngInput) {
  const mapEl = document.getElementById(mapId);
  if (!mapEl || typeof L === "undefined") return;
  const startLat = parseFloat(latInput.value);
  const startLng = parseFloat(lngInput.value);
  const hasStart = Number.isFinite(startLat) && Number.isFinite(startLng);
  const map = L.map(mapId).setView(hasStart ? [startLat, startLng] : [41.7151, 44.8271], hasStart ? 16 : 12);
  addBaseTiles(map);
  let marker = null;
  function place(latlng) {
    if (marker) marker.setLatLng(latlng);
    else {
      marker = L.marker(latlng, {draggable: true}).addTo(map);
      marker.on("dragend", function () { place(marker.getLatLng()); });
    }
    latInput.value = latlng.lat.toFixed(6);
    lngInput.value = latlng.lng.toFixed(6);
    map.panTo(latlng);
  }
  if (hasStart) place({lat: startLat, lng: startLng});
  map.on("click", function (event) { place(event.latlng); });
  const locate = mapEl.parentNode.querySelector("[data-locate]");
  if (locate && navigator.geolocation) {
    locate.addEventListener("click", function () {
      navigator.geolocation.getCurrentPosition(function (pos) {
        place({lat: pos.coords.latitude, lng: pos.coords.longitude});
        map.setZoom(16);
      });
    });
  }
  setTimeout(function () { map.invalidateSize(); }, 200);
}
</script>
